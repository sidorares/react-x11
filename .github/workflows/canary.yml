name: canary

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base version the canary is a pre-release of
        required: false
        default: 2.0.0

permissions:
  contents: read
  id-token: write

jobs:
  publish-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Like release-please.yml, this
      # publishes via OIDC — this workflow file (canary.yml) must be added as a
      # trusted publisher for the package on npmjs.com in addition to
      # release-please.yml; trusted-publisher config is per workflow file.
      - run: npm install -g npm@latest
      - run: npm ci
      # The "g" prefix keeps the sha identifier from being parsed as a number
      # (a numeric identifier with a leading zero is invalid semver).
      - name: Set canary version
        env:
          BASE: ${{ inputs.base }}
        run: |
          VERSION="$BASE-canary.$(date -u +%Y%m%d%H%M%S).g$(git rev-parse --short HEAD)"
          npm version --no-git-tag-version "$VERSION"
          echo "Publishing react-x11@$VERSION from $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm publish --access public --tag canary
