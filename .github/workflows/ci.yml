name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about 40 seconds. A job with no ceiling that stops
    # making progress holds a runner for six hours and uploads no log at all,
    # so there is nothing to read afterwards — which is exactly the case this
    # exists for. Well clear of a slow runner, nowhere near the default.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # `--test-reporter=spec` so a run that stops making progress says which
      # file it was in: the tap reporter buffers per file and prints nothing
      # for the one that never finished.
      - run: npm test -- --test-reporter=spec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  # The docs site renders the repo's own docs/ and runs the real renderer in
  # the browser, so it goes stale the moment the API moves. This job is what
  # notices: check-demos runs every playground demo against the in-process X
  # server and asserts it mounts, paints and responds to input.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
