name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about 40 seconds. A job with no ceiling that stops
    # making progress holds a runner for six hours and uploads no log at all,
    # so there is nothing to read afterwards — which is exactly the case this
    # exists for. Well clear of a slow runner, nowhere near the default.
    #
    # It is the outer fence, not the first line: `--test-timeout` in the test
    # script fails the individual test by name, which is the thing you actually
    # want in the log. This only catches a hang no per-test deadline can see.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # `--test-reporter=spec` so a run that stops making progress says which
      # file it was in: the tap reporter buffers per file and prints nothing
      # for the one that never finished.
      - run: npm test -- --test-reporter=spec

  # The protocol-efficiency gate: every scenario in scripts/bench/protocol.js
  # runs against the in-process X server and its requests, bytes, composite
  # pixels, blocking round trips (stalls), repeated identical queries and
  # short-lived resource churn are compared to the committed baseline. A PR
  # that makes the renderer chattier — or reintroduces a create/free cycle
  # the baseline shows removed — fails here with the metric that moved.
  # Improvements sail through (--check only fails on increases); re-save the
  # baseline on the base branch first, then on the PR, so the diff is honest.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each scenario runs in its own process (issue #416): in one process
      # they are not independent — a change to an earlier scenario's garbage
      # moves when the collector runs inside a later one, and a pause inside
      # a paced frame turns that frame's bounded repaint into a full-window
      # one, which is a 6x metric swing no tolerance can absorb.
      # One retry on top, for the per-scenario event-loop jitter the header
      # of scripts/bench/protocol.js describes: a real regression fails
      # twice; a rare unlucky run does not.
      - run: npm run bench -- --check || npm run bench -- --check
      # The other half of the gate, and the one that makes the first half
      # safe: cheaper is only an optimization if the picture is the same.
      # No retry here — a hash is exact, so a second run cannot disagree.
      - run: npm run bench:pixels -- --check

  # The Cocoa frame-clock gate, run only when a change can reach it. The
  # touched runner reads the PR's diff against its base and owes the
  # presenters bench for hot-path files alone — the paint walk and damage
  # model, the layout floors, the event dispatch, src/cocoa, the benches and
  # the dependency manifest — so a docs PR spends nothing here and a
  # nodes.js PR spends two minutes. What it judges is structural
  # (scripts/bench/presenters-gate.json): full-window frames, the share of
  # the window one cell repaints, frames per resize tick, frames painted for
  # a window nobody can see. Never milliseconds — a shared runner's timings
  # say nothing, and the table it prints is for the human reading the log.
  # A push to master runs every scenario, for the trend.
  bench-cocoa:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # the diff against the PR base is what decides whether to run
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench:touched -- --benches=presenters --ci ${{ github.event_name == 'push' && '--all' || format('--base={0}', github.event.pull_request.base.sha) }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  # The docs site renders the repo's own docs/ and runs the real renderer in
  # the browser, so it goes stale the moment the API moves. This job is what
  # notices: check-demos runs every playground demo against the in-process X
  # server and asserts it mounts, paints and responds to input.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
