<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>react-x11 playground runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
<script type="module">
// A real X session in an iframe. The whole stack — react-x11, React, ntk,
// node-x11 and its pure-JS X server — is the module bundle built by
// website/scripts/build-demo-bundles.mjs. Editor contents arrive from the
// parent frame over postMessage, get compiled from JSX, and run against the
// in-page server exactly the way a node program runs against a real
// display: by connecting through DISPLAY.
//
// The bundle is imported dynamically because its URL has to be derived from
// this page's: static servers disagree on the canonical path (GitHub Pages
// serves /demo/runner/, `docusaurus serve` clean-URLs it to /demo/runner),
// so no fixed relative specifier works for both.
const demoBase = location.pathname.replace(/\/demo\/.*$/, '/demo/');

function post(msg) {
  window.parent.postMessage(msg, '*');
}

function stringify(arg) {
  if (typeof arg === 'string') return arg;
  if (arg instanceof Error) return String(arg.stack || arg);
  try {
    return JSON.stringify(arg);
  } catch {
    return String(arg);
  }
}

let RX;
try {
  RX = await import(demoBase + 'react-x11-runtime.js');
} catch (err) {
  post({ type: 'console', level: 'error',
         text: 'failed to load the runtime bundle: ' + stringify(err) });
  throw err;
}

const params = new URLSearchParams(location.search);
const WIDTH = parseInt(params.get('width'), 10) || 640;
const HEIGHT = parseInt(params.get('height'), 10) || 480;

// process.env.DISPLAY is what ntk's createClient() consults, same as in
// node. The 'demo' protocol connects straight to the in-page server.
process.env.DISPLAY = 'demo/local:0';

// The browser has no fontconfig: install the bundled DejaVu faces as the
// process-wide font source before any demo runs, so `fontFamily:
// 'sans-serif'` resolves and <text> measures to something other than 0x0.
await RX.setupFonts();

// --- the X screen ----------------------------------------------------------

const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const server = RX.xserver.createServer({ width: WIDTH, height: HEIGHT });
new RX.CanvasPresenter(server, canvas);
setupGlx(server);

const streams = [];
RX.x11.registerDisplayProtocol('demo', () => {
  const [clientSide, serverSide] = RX.createStreamPair();
  server.addClientStream(serverSide);
  streams.push(clientSide);
  return clientSide;
});

// node-x11's GLX emulator replays indirect-GLX protocol onto a WebGL2
// context, which is what lets <glarea> and the 3D scene elements draw here.
// It stays optional: a wiring failure must not break the 2d demos.
function setupGlx(srv) {
  const glx = RX.glx;
  if (!glx || typeof glx.createGlxExtension !== 'function') return false;
  try {
    const glCanvas = document.createElement('canvas');
    glCanvas.width = srv.width;
    glCanvas.height = srv.height;
    const gl = glCanvas.getContext('webgl2', {
      preserveDrawingBuffer: true, stencil: true, depth: true, alpha: false,
    });
    if (!gl) return false;
    srv.registerExtension('GLX', glx.createGlxExtension({
      backend: new glx.WebGLBackend(gl),
      getDrawableSurface(xid) {
        const res = srv.resources.get(xid);
        if (!res || !res.raster) return null;
        return {
          get width() { return res.raster.width; },
          get height() { return res.raster.height; },
          notifySwap(pixels) {
            if (!pixels) return;
            if (pixels.length === res.raster.data.length)
              res.raster.data.set(pixels);
            if (typeof srv.damageWindow === 'function' && res.mapped !== undefined)
              srv.damageWindow(res);
          },
        };
      },
    }));
    return true;
  } catch {
    return false;
  }
}

// --- running one edit ------------------------------------------------------

// The server outlives a single Run; the connection does not. Every
// `createRoot()` dials DISPLAY afresh through the 'demo' protocol above and
// owns what it opened, so unmounting the previous tree destroys its X
// windows *and* closes its stream — the same path a real app's shutdown
// takes. The server keeps running and hands the next Run a new one.
const mounted = new Set();
let timers = { intervals: [], timeouts: [] };

function trackRoot(root) {
  mounted.add(root);
  return root;
}

// What demo code sees as its module graph.
const demoModules = {
  react: RX.React,
  ntk: RX.ntk,
  x11: RX.x11,
  'react-x11': new Proxy(RX.reactX11, {
    get(target, prop) {
      if (prop === 'createRoot')
        return (...args) => target.createRoot(...args).then(trackRoot);
      return target[prop];
    },
  }),
};

function demoRequire(name) {
  if (Object.hasOwn(demoModules, name)) return demoModules[name];
  throw new Error(
    `module not available in the playground: ${name} — ` +
      'the bundle carries react-x11, react, ntk and x11'
  );
}

function makeConsole() {
  const emit = (level) => (...args) =>
    post({ type: 'console', level, text: args.map(stringify).join(' ') });
  return { log: emit('log'), info: emit('log'), debug: emit('log'),
           warn: emit('warn'), error: emit('error') };
}

function teardown() {
  timers.intervals.forEach(clearInterval);
  timers.timeouts.forEach(clearTimeout);
  timers = { intervals: [], timeouts: [] };
  for (const root of mounted) {
    // unmount() brings the tree down synchronously and closes the socket
    // after; the promise is not awaited here because teardown must stay
    // synchronous, but it has to be handled or a dead connection becomes an
    // unhandled rejection in the middle of the next Run
    try { root.unmount()?.catch(() => {}); } catch { /* already gone */ }
  }
  mounted.clear();
}

async function runCode(source) {
  teardown();
  let code;
  try {
    code = RX.transformJsx(source);
  } catch (err) {
    post({ type: 'console', level: 'error', text: stringify(err) });
    return;
  }
  const trackInterval = (fn, ms, ...a) => {
    const id = setInterval(fn, ms, ...a);
    timers.intervals.push(id);
    return id;
  };
  const trackTimeout = (fn, ms, ...a) => {
    const id = setTimeout(fn, ms, ...a);
    timers.timeouts.push(id);
    return id;
  };
  try {
    // wrapped in an async IIFE: playground code is written with top-level
    // await (`const root = await createRoot()`), which a Function body
    // cannot have
    const fn = new Function(
      'require', 'React', 'process', 'console',
      'setInterval', 'setTimeout', 'clearInterval', 'clearTimeout',
      `return (async () => {\n${code}\n})();`
    );
    await fn(demoRequire, RX.React, process, makeConsole(),
             trackInterval, trackTimeout, clearInterval, clearTimeout);
  } catch (err) {
    post({ type: 'console', level: 'error', text: stringify(err) });
  }
}

// async errors from demo callbacks (event handlers, animation frames)
window.addEventListener('error', (ev) => {
  post({ type: 'console', level: 'error', text: stringify(ev.error || ev.message) });
});
window.addEventListener('unhandledrejection', (ev) => {
  post({ type: 'console', level: 'error', text: stringify(ev.reason) });
});

window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'run-code') runCode(String(ev.data.code || ''));
});

canvas.focus();
post({ type: 'ready', glx: !!RX.glx });
</script>
</body>
</html>
